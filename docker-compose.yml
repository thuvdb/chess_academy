# version: '3.8'

# Shared environment for backend / worker / beat.
# Secrets have NO defaults: copy .env.example to .env and fill them in.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-cams_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-cams_db}}
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD}@redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD}@redis:6379/1}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
  UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
  STOCKFISH_PATH: ${STOCKFISH_PATH:-/usr/games/stockfish}
  STOCKFISH_DEPTH: ${STOCKFISH_DEPTH:-15}
  YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-models/chess_yolov8s.pt}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Cams@2026!}
  DEFAULT_BRANCH_NAME: ${DEFAULT_BRANCH_NAME:-Cơ sở Chính - Quận 1}

services:
  db:
    image: postgres:16-alpine
    container_name: cams_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cams_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cams_db}
    # No published ports: reachable only from the internal compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cams_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    # No published ports: reachable only from the internal compose network.
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cams_backend
    restart: always
    environment: *backend-env
    # No published ports in base compose: internal network only (nginx proxies /api, /ws, /static).
    # For local debug with port 8000 and --reload, see docker-compose.override.yml.
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cams_worker
    restart: always
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    mem_limit: 2g
    memswap_limit: 2g

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cams_beat
    restart: always
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: celery -A app.core.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
        VITE_DEFAULT_TIMEZONE: ${VITE_DEFAULT_TIMEZONE:-Asia/Ho_Chi_Minh}
        VITE_PAGE_SIZE: ${VITE_PAGE_SIZE:-20}
    container_name: cams_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
