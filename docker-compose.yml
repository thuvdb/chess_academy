version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cams_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cams_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cams_password}
      POSTGRES_DB: ${POSTGRES_DB:-cams_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cams_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

#  minio:
#    image: quay.io/minio/minio
#    container_name: cams_minio
#    restart: always
#    environment:
#      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cams_admin}
#      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cams_admin123}
#    ports:
#      - "9000:9000"
#      - "9001:9001"
#    volumes:
#      - minio_data:/data
#    command: server /data --console-address ":9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cams_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cams_user}:${POSTGRES_PASSWORD:-cams_password}@db:5432/${POSTGRES_DB:-cams_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cams_worker
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cams_user}:${POSTGRES_PASSWORD:-cams_password}@db:5432/${POSTGRES_DB:-cams_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: celery -A app.core.celery_app worker --loglevel=info

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cams_beat
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cams_user}:${POSTGRES_PASSWORD:-cams_password}@db:5432/${POSTGRES_DB:-cams_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: celery -A app.core.celery_app beat --loglevel=info

  frontend:
    image: node:20-alpine
    container_name: cams_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "echo 'Frontend container initialized' && tail -f /dev/null"

volumes:
  postgres_data:
  redis_data:
  minio_data:
