# version: '3.8'

# Shared environment for backend / worker / beat.
# Secrets have NO defaults: copy .env.example to .env and fill them in.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cams_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-cams_db}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  DEBUG: ${DEBUG:-false}
  CORS_ORIGINS: '["https://cams-app.duckdns.org","http://cams-app.duckdns.org","http://129.153.55.144:3000","http://129.153.55.144","http://localhost:3000","http://localhost:5173"]' 
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}

services:
  db:
    image: postgres:16-alpine
    container_name: cams_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cams_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cams_db}
    # No published ports: reachable only from the internal compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cams_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    # No published ports: reachable only from the internal compose network.
    volumes:
      - redis_data:/data


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cams_backend
    restart: always
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cams_worker
    restart: always
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    mem_limit: 2g
    memswap_limit: 2g

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cams_beat
    restart: always
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: celery -A app.core.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://cams-api.duckdns.org/api
    container_name: cams_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
